name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Detecter Gradle
        id: gradle-ver
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "version=wrapper" >> "$GITHUB_OUTPUT"
          else
            echo "version=current" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle-ver.outputs.version }}
      - name: Creer debug.keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Compiler l'APK
        run: gradle assembleDebug
      - name: Sauvegarder l'APK
        uses: actions/upload-artifact@v4
        with:
          name: AlgoStrict-apk
          path: "**/build/outputs/apk/debug/*.apk"
